[package]
name = "y-note"
version = "0.1.0"
description = "Local-first lossless Markdown editor"
authors = ["Y Note"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "y_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22"
notify = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
url = "2"
